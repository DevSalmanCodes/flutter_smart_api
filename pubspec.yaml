name: flutter_smart_api
description: >
  A production-ready Flutter API layer that eliminates repetitive boilerplate code.
  Provides automatic Dio setup, token injection, error handling, JSON parsing, 
  logging, retry logic, and optional in-memory caching.
version: 1.0.2
homepage: https://github.com/DevSalmanCodes/flutter_smart_api
repository: https://github.com/DevSalmanCodes/flutter_smart_api
issue_tracker: https://github.com/DevSalmanCodes/flutter_smart_api/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  # No assets or fonts for a pure Dart/API package
